<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Load User</title>
</head>
<body>
    <div id="loading" style="display: none;">Loading....</div>
    <button id="btn-refresh">Refresh</button>
    <div id="user-container"></div>

<script>

    // Live Demo Code: fetch-users.js
    const userContainer = document.querySelector("#user-container");
    const loadingIndicator = document.querySelector("#loading");

    async function loadUsers() {
        try {
            userContainer.innerHTML = "";
            loadingIndicator.style.display = "block";
            const response = await fetch("https://jsonplaceholder.typicode.com/users");
            
            if (!response.ok) {
                throw new Error("HTTP Error! Status: " + response.status);
            }

            const users = await response.json();
            // userContainer.innerHTML = "";

            users.forEach(({ name, email, company }) => {
                const card = document.createElement("div");
                card.className = "user-card";
                card.innerHTML = "<h4>" + name + "</h4><p>Email: " + email + "</p><small>Perusahaan: " + company.name + "</small>";
                userContainer.appendChild(card);
            });
        } catch (error) {
            console.error("Gagal mengambil data pengguna:", error);
            userContainer.innerHTML = "<p class=\"error\">Gagal memuat data: " + error.message + "</p>";
        } finally {
            loadingIndicator.style.display = "none";
        }
    }

    document.querySelector("#btn-refresh").addEventListener("click", loadUsers);
    loadUsers();

</script>

</body>
</html>
